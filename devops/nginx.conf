worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
  limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/s;

  upstream bodalink_cluster {
    least_conn;
    server bodalink-api:3000;
  }

  # Customer & Rider API + Real-Time Socket.IO (api.bodalink.com)
  server {
    listen 80;
    server_name api.bodalink.com app.bodalink.com;

    location /socket.io/ {
      proxy_pass http://bodalink_cluster;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
      limit_req zone=api_limit burst=50 nodelay;
      proxy_pass http://bodalink_cluster;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://bodalink_cluster;
    }
  }

  # Strictly Isolated Admin Portal Subdomain (admin.bodalink.com)
  server {
    listen 80;
    server_name admin.bodalink.com;

    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none';" always;

    location /api/admin/ {
      limit_req zone=admin_limit burst=20 nodelay;
      proxy_pass http://bodalink_cluster;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
      proxy_pass http://bodalink_cluster;
    }
  }
}
