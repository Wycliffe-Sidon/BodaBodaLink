name: BodaLink Production CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

jobs:
  quality-security-and-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_DB: bodalink_test
          POSTGRES_USER: bodalink_ci
          POSTGRES_PASSWORD: ci_secure_password
        ports:
          - 5432:5432
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck & Lint
        run: npm run lint
      - name: OWASP Dependency Audit
        run: npm audit --audit-level=high
      - name: Build Production Bundle
        run: npm run build

  deploy-cloud:
    needs: quality-security-and-tests
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Push Multi-Cloud Container Image
        run: |
          docker build -f devops/Dockerfile.backend -t ghcr.io/bodalink/platform:${{ github.sha }} .
